server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/html text/xml text/plain text/css application/javascript application/rss+xml application/atom+xml;

    gzip on;
    gzip_types text/plain text/css text/xml application/xml application/atom+xml application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    error_page 404 /404.html;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location /css/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /img/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
